[package]
name = "LightLaser"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
eframe = "0.36.2"
egui = { version = "0.36.2", features = ["serde"] }
egui-elegance = "0.16.1"
egui-phosphor = "0.14.0"
egui_extras = { version = "0.36.2", features = ["image", "all_loaders"] }

# Serial / GRBL
serialport = "4.7"

# Image / SVG
image = { version = "0.25.10", features = ["png", "jpeg", "bmp"] }
resvg = "0.45"
tiny-skia = "0.11"

# Config / Serialization
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

# Logging
log = "0.4.29"
env_logger = "0.11.10"

# i18n
rust-i18n = { version = "4.0.0", features = ["log-miss-tr"] }

# Utils
directories = "6.0.0"
chrono = "0.4.45"
rfd = "0.17.2"
palette = "0.7.7"
dirs = "7.0.0"
clipper2 = "0.6.0"