[package]
name = "LightLaser"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
eframe = "0.36.2"
egui = { version = "0.36.2", features = ["serde"] }
egui-phosphor = "0.14.0"
egui_extras = { version = "0.36.2", features = ["image", "all_loaders"] }

serialport = "4.7"

image = { version = "0.25.10", features = ["png", "jpeg", "bmp"] }
resvg = "0.45"
tiny-skia = "0.11"

serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

log = "0.4.29"
env_logger = "0.11.10"

rust-i18n = { version = "4.0.0", features = ["log-miss-tr"] }

directories = "6.0.0"
chrono = "0.4.45"
rfd = "0.17.2"
palette = "0.7.7"
dirs = "7.0.0"
clipper2 = "0.6.0"
tiny-skia-path = "0.11.4"
gerber_parser = "0.4.0"
evalexpr = "11"
lyon = "1"